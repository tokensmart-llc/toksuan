services:
  postgres:
    image: postgres:16-alpine
    container_name: tokensmart-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: tokensmart
      POSTGRES_PASSWORD: tokensmart_dev
      POSTGRES_DB: tokensmart
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tokensmart -d tokensmart"]
      interval: 5s
      timeout: 5s
      retries: 10

  pgweb:
    image: sosedoff/pgweb:latest
    container_name: tokensmart-pgweb
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8081:8081"
    environment:
      DATABASE_URL: postgres://tokensmart:tokensmart_dev@postgres:5432/tokensmart?sslmode=disable

volumes:
  postgres-data:
